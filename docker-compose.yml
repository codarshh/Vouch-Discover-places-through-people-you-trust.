version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: friendplace-db
    environment:
      POSTGRES_USER: friendplace
      POSTGRES_PASSWORD: password
      POSTGRES_DB: friendplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
